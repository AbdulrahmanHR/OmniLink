name: CI

on:
  # Restored at M68 (v3.0 open-source pivot). CI must run automatically before
  # the repository goes public — merging a stranger's change to a
  # firmware-flashing tool on eyeball review alone is the worst failure mode
  # this project can produce. Long-lived branches only (project policy §7):
  # never a sub-branch such as `3.0.0`.
  push:
    branches: [main, v3]
  pull_request:
    branches: [main, v3]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege, workflow-wide (M74). Every job here only reads the checkout
# and uploads an artifact — neither needs a write scope, and a pull request from
# a FORK gets a read-only GITHUB_TOKEN regardless, so asking for a write scope
# would fail the run rather than grant anything. Declaring it here means a new
# job inherits read-only unless it deliberately overrides.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      # --- Frontend checks ---
      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/

      - name: Frontend unit tests
        # Worker count is pinned to 2 in vitest.config.ts (M74): two ML specs
        # assert timing budgets and flake when the runner is oversubscribed. CI
        # inherits the pin from the config, so no flag belongs here.
        run: npm test

      # --- Rust checks ---
      - name: Cargo fmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # No job-level `permissions:` — it inherits the workflow-level `contents:
    # read`. This job used to request `actions: write` for an artifact-prune
    # step; both are gone (M74). See the retention note on the upload below.
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Run E2E tests
        # Worker count is pinned to 2 in playwright.config.ts (M74) — MapLibre/GPU
        # contention flakes above that. Inherited from the config, not a flag here.
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          # Raised 7 → 30 at M74, and the artifact-prune step that used to keep
          # this workflow at a single live report is DELETED. Two reasons:
          #
          #  1. It could not work for a contributor. A pull request from a fork
          #     receives a read-only GITHUB_TOKEN, so `gh api -X DELETE
          #     .../artifacts/{id}` returns 403 and the step failed on every
          #     fork PR — the first thing a stranger would have seen.
          #  2. It stops being needed. Actions storage and minutes are free for
          #     public repositories, and the prune existed only to defend an
          #     account-level storage quota that public repos do not consume.
          #
          # The report is a few MB, so 30 days is cheap even while the
          # repository is still private (M73 flips visibility). If the private
          # window ever stretches, lower this rather than reinstating a prune
          # step that forks cannot run.
          retention-days: 30
