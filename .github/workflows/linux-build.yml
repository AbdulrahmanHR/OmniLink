name: Linux Build

# Builds Linux installers (.deb + .AppImage) so the app can be tried on real
# hardware from a Linux host. Artifacts are attached to each run — download,
# install, test. No code signing. Mirrors windows-build.yml.

on:
  # Restored at M68. Long-lived branches only (project policy §7) — never a
  # sub-branch such as `3.0.0`; a sub-branch's installers get built when it is
  # merged back into `v3`, which is already a trigger.
  push:
    branches: [main, v3]
  workflow_dispatch: # lets you trigger a build manually from the Actions tab

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege, workflow-wide (M74). Read the checkout, upload an artifact —
# nothing else. The artifact-prune step that needed `actions: write` has been
# deleted (see the retention note on the upload step).
permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux installers
    runs-on: ubuntu-latest
    # Skip in forks (M74). This workflow needs TAURI_SIGNING_PRIVATE_KEY —
    # `createUpdaterArtifacts` is on, so tauri-action FAILS without it — and a
    # fork has no such secret. Without this guard, anyone who forks the repo and
    # pushes to their own `main` gets an immediately-red "Linux Build" that they
    # cannot fix and that burns their Actions minutes. It is never on the
    # pull_request path (see the trigger above), so this changes nothing for PRs.
    if: github.repository == 'AbdulrahmanHR/OmniLink'
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Remove stale installers from the build cache
        # The Cargo cache restores src-tauri/target/, which includes any
        # installers produced by previous (older-version) runs. Delete the
        # bundle output before building so the uploaded artifact contains ONLY
        # the current version's installers, never older versions.
        run: rm -rf src-tauri/target/release/bundle

      - name: Build Tauri app (Linux)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        # No tagName/releaseId -> tauri-action only builds the bundles,
        # it does not create a GitHub Release.
        # Signing key required because createUpdaterArtifacts is enabled.
        # Add these as repo secrets (Settings -> Secrets and variables -> Actions).
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: omnilink-linux-installers
          if-no-files-found: error
          # Raised 7 → 14 at M74, and the artifact-prune step that used to keep
          # this workflow at a single live artifact is DELETED. It needed
          # `actions: write`, which is the scope a fork's read-only GITHUB_TOKEN
          # will never have, and it existed only to defend an account-level
          # Actions storage quota that public repositories do not consume.
          #
          # 14 rather than 30 (the CI Playwright report's figure) because this is
          # the heaviest artifact of the three — ~90 MB, almost entirely the
          # AppImage — and the repository is still private until M73, where the
          # quota is real. Retention is deliberately proportional to size.
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
