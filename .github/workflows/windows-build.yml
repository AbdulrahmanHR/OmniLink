name: Windows Build

# Builds a Windows installer so the app can be tried on real hardware
# (WSL can't see COM ports; a native Windows binary can). Artifacts are
# attached to each run — download, install, test. No code signing.

on:
  # M68: retargeted from `v2` to `v3` for the v3 line. Long-lived branches only
  # (project policy §7) — never a sub-branch such as `3.0.0`.
  push:
    branches: [main, v3]
  workflow_dispatch: # lets you trigger a build manually from the Actions tab

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege, workflow-wide (M74). Read the checkout, upload an artifact —
# nothing else. The artifact-prune step that needed `actions: write` has been
# deleted (see the retention note on the upload step).
permissions:
  contents: read

# Only the newest push to a branch is worth an installer; cancel superseded
# runs so rapid pushes don't burn minutes (or leave half-built artifacts).
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    # Skip in forks (M74). This workflow needs TAURI_SIGNING_PRIVATE_KEY —
    # `createUpdaterArtifacts` is on, so tauri-action FAILS without it — and a
    # fork has no such secret. Without this guard, anyone who forks the repo and
    # pushes to their own `main` gets an immediately-red "Windows Build" that
    # they cannot fix, and Windows runners bill at 2× the Linux minute rate
    # against their free allowance. It is never on the pull_request path (see the
    # trigger above), so this changes nothing for PRs.
    if: github.repository == 'AbdulrahmanHR/OmniLink'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Remove stale installers from the build cache
        shell: pwsh
        # The Cargo cache restores src-tauri/target/, which includes any
        # installers produced by previous (older-version) runs. Delete the
        # bundle output before building so the uploaded artifact contains ONLY
        # the current version's installer, never older versions.
        run: |
          $bundle = "src-tauri/target/release/bundle"
          if (Test-Path $bundle) { Remove-Item -Recurse -Force $bundle }

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v0
        # No tagName/releaseId -> tauri-action only builds the bundles,
        # it does not create a GitHub Release.
        # Signing key required because createUpdaterArtifacts is enabled.
        # Add these as repo secrets (Settings -> Secrets and variables -> Actions).
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: omnilink-windows-installers
          if-no-files-found: error
          # Raised 7 → 14 at M74, and the artifact-prune step that used to keep
          # this workflow at a single live artifact is DELETED. It needed
          # `actions: write`, which is the scope a fork's read-only GITHUB_TOKEN
          # will never have, and it existed only to defend an account-level
          # Actions storage quota that public repositories do not consume.
          #
          # 14 rather than 30 (the CI Playwright report's figure) because the
          # .msi + .exe pair runs to tens of MB and the repository is still
          # private until M73, where the quota is real. Retention is deliberately
          # proportional to size. Released installers live on the GitHub Release
          # (see release.yml), not here.
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
