<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Base Icon Shape -->
  <rect width="100" height="100" fill="#0d1117" rx="22" />

  <!-- Oscilloscope Grid -->
  <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
    <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#1f2937" stroke-width="0.5"/>
  </pattern>
  <rect width="100" height="100" fill="url(#grid)" rx="22" />

  <!-- Signal / Telemetry Waveform -->
  <g transform="translate(0, 0)">
    <!-- Outer glow -->
    <path d="M 15 50 Q 32.5 20, 50 50 T 85 50" fill="none" stroke="#00FFAA" stroke-width="6" opacity="0.3" stroke-linecap="round" />
    <!-- Inner trace -->
    <path d="M 15 50 Q 32.5 20, 50 50 T 85 50" fill="none" stroke="#00FFAA" stroke-width="2.5" stroke-linecap="round" />
    <!-- Node points -->
    <circle cx="15" cy="50" r="2.5" fill="#ffffff" />
    <circle cx="50" cy="50" r="2.5" fill="#ffffff" />
    <circle cx="85" cy="50" r="2.5" fill="#ffffff" />
  </g>
</svg>
